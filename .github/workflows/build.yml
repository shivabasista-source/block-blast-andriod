name: Build Block Blast APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Check project ZIP
        run: |
          ls -la
          unzip -l 2d-block-blast-android-project.zip

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o 2d-block-blast-android-project.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project
          GRADLEW=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No Gradle wrapper found in the ZIP."
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Block-Blast-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
