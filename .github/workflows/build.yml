name: Build Block Blast APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract game source code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Game ZIP not found."
            exit 1
          fi
          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project
          test -f project/package.json || {
            echo "ERROR: package.json not found."
            exit 1
          }

      - name: Install dependencies
        working-directory: project
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Configure Android app
        working-directory: project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.blockblast.game",
            "appName": "Block Blast",
            "webDir": "dist"
          }
          EOF

      - name: Build web game
        working-directory: project
        run: npm run build

      - name: Create Android project
        working-directory: project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Block-Blast-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
