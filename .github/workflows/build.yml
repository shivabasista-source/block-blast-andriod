name: Build Block Blast APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract game source code
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          PACKAGE_FILE=$(find project -type f -name package.json \
            -not -path '*/node_modules/*' | head -1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(realpath "$PACKAGE_FILE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Game project found at: $PROJECT_DIR"
          
      - name: Install game dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps
          npm install esbuild@^0.28.0 --save-dev --legacy-peer-deps
          npm install @capacitor/core@7 @capacitor/android@7 --legacy-peer-deps
          npm install --save-dev @capacitor/cli@7 --legacy-peer-deps

      - name: Configure Android app
        run: |
          cd "$PROJECT_DIR"
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.blockblast.game",
            "appName": "Block Blast",
            "webDir": "dist"
          }
          EOF

      - name: Build web game
        run: |
          cd "$PROJECT_DIR"
          sed -i '/bundledWebRuntime/d' capacitor.config.ts
          npm run build

      - name: Create Android project
        run: |
          cd "$PROJECT_DIR"
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Block-Blast-APK
          path: project/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
